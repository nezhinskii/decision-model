[project]
name = "decision-research"
version = "0.1.0"
description = "Research on direct decision readouts over language model representations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.11.0",
    "tyro>=0.9,<1",
    "pydantic>=2,<3",
    "numpy>=2.4.6",
    "pyarrow>=25,<26",
    "huggingface-hub>=2.2.0",
    "transformers>=4.51,<6",
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "safetensors>=0.8.0",
    "tqdm>=4.67,<5",
    "flash-linear-attention[cuda]>=0.6.0; sys_platform == 'linux'",
    # Windows supplies the same `triton` import through triton-windows.
    # Avoid FLA's CUDA extra here: it requires the Linux-only distribution.
    "flash-linear-attention>=0.6.0; sys_platform == 'win32'",
    "triton-windows>=3.6,<3.7; sys_platform == 'win32'",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8,<10",
    "mlflow>=3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

